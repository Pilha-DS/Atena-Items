services:
  atena-hub:
    build: .
    image: atena-hub:2.2.0
    container_name: atena-hub
    restart: unless-stopped
    ports:
      # host:container — change the host port if 8080 is already taken
      # (phpMyAdmin, another dev server...). Also settable in .env as
      # ATENA_HOST_PORT so clients can keep the URL stable.
      - "${ATENA_HOST_PORT:-8080}:8080"
    environment:
      # Leave empty to have a token generated on first start (printed in the log).
      # Set it to pin your own token; it must then match the token in the apps.
      ATENA_TOKEN: ${ATENA_TOKEN:-}
      # Optional, only used as a hint on the start page.
      ATENA_PUBLIC_URL: ${ATENA_PUBLIC_URL:-}
      # Admin screen (/admin): who is syncing, how much each device sends and
      # receives, and the tokens for the clients. Without both variables the
      # screen does not exist (404).
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Universal store caps: one record (document) and one file. Files are
      # streamed to disk in the same volume, so they survive a restart.
      ATENA_MAX_RECORD_KB: ${ATENA_MAX_RECORD_KB:-512}
      ATENA_MAX_BLOB_MB: ${ATENA_MAX_BLOB_MB:-256}
    volumes:
      # The database lives here. Back this volume up; it is your server copy.
      #
      # The volume keeps the old name on purpose: renaming it would mount an
      # empty directory and look like every note had been deleted. The hub
      # also reuses an existing `jotter-server.db` inside it.
      - jotter-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  jotter-data:
