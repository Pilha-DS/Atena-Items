# Chaves aplicadas com kwriteconfig6.
#
# Formato:  arquivo | grupo | chave | valor
#
# Só o que é nosso. O resto do arquivo continua sendo do KDE e do usuário:
# por isso a aplicação é chave a chave, e não sobrescrevendo o .rc inteiro.
# Arquivos que são 100% nossos ficam em configs/files/ e são substituídos.

# --- Dolphin ---------------------------------------------------------------
# Barra de filtro, barra de status, slider de zoom e dicas: nenhum deles
# aparece até você pedir (Ctrl+I / F9 / F11 continuam funcionando).
dolphinrc|General|FilterBar|false
dolphinrc|General|ShowStatusBar|2
dolphinrc|General|ShowZoomSlider|false
dolphinrc|General|ShowToolTips|false
# Modo de seleção (checkbox no hover) e barra de colar: são de toque, não de mouse.
dolphinrc|General|ShowSelectionToggle|false
dolphinrc|General|ShowPasteBarAfterCopying|false
# Abas aparecem só quando existem duas ou mais; sem split view permanente.
dolphinrc|General|AlwaysShowTabBar|false
dolphinrc|General|SplitView|false
# Painéis travados: sem arrastar Places/Information por acidente.
dolphinrc|General|LockPanels|true
dolphinrc|General|ShowFullPathInTitlebar|false
# Caminho em migalhas (clicar para editar) em vez da barra de URL sempre editável.
dolphinrc|General|EditableUrl|false
dolphinrc|MainWindow|MenuBar|Disabled

# --- Diálogos de abrir/salvar (compartilhados por todos os apps KDE) -------
# Prévia e atalhos laterais ocupam espaço e, na maioria das vezes, ninguém usa.
kdeglobals|KFileDialog Settings|Show Preview|false
kdeglobals|KFileDialog Settings|Show Inline Previews|false
kdeglobals|KFileDialog Settings|Show Speedbar|false

# --- Ícones ----------------------------------------------------------------
# Tema do sistema inteiro (painel, Dolphin, diálogos e a janela de
# configurações): os KCMs desenham os próprios ícones, então trocar só na
# nossa janela deixaria ela em desacordo com o resto da sessão.
# Breeze-Noir-White-Blue: as formas do Breeze (que os KCMs já esperam), recoloridas
# em branco com um azul de acento. É monocromático onde a cor não informa nada e
# não inventa desenho novo — o que aparece num canto da tela não briga com o
# resto da sessão.
# Precisa estar instalado em ~/.local/share/icons ou /usr/share/icons; o
# install.sh avisa se o tema não existir nesta máquina.
kdeglobals|Icons|Theme|Breeze-Noir-White-Blue
