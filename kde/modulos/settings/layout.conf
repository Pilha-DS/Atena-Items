# Layout da janela de configurações do Atena.
#
# Menu da esquerda = [grupos]. Abas de cima = as linhas sem indentação dentro do
# grupo. Cada linha indentada é um KCM (id de plugin) com o rótulo que aparece
# na tela. Um rótulo para vários ids não existe: um id por linha, sempre.
#
# Aba com mais de um KCM vira sub-abas: os KCMs aparecem como uma fileira de
# chips (terceiro nível) e a tela mostra um de cada vez. Não empilhe assuntos
# diferentes na mesma tela — se a aba tem "Perfis de energia" e "Energia móvel",
# são dois chips, não dois formulários um embaixo do outro.
#
# Os rótulos são nossos (pt-BR), não os do Plasma: é aqui que o agrupamento é
# decidido. Um id só aparece se estiver neste arquivo, e o `--check` avisa se
# algum KCM da máquina ficou de fora.
#
# Ícone: `@ nome-do-icone` no fim de qualquer linha (grupo, aba ou KCM). São
# nomes do tema de ícones ativo (hoje o Breeze-Noir-White-Blue, com o Breeze como
# herança), não caminhos. Só é preciso escrever quando:
#   - é um grupo (não tem KCM para emprestar ícone);
#   - é uma aba que junta vários KCMs (não existe "ícone da aba").
# Aba com um único KCM herda o ícone do plugin, e um KCM só precisa do `@` para
# discordar dele — e para não repetir o mesmo desenho de outro chip da mesma
# aba. `--list` mostra o ícone em uso de cada linha.
#
# Linhas de KCM marcadas com "# extra" foram encaixadas por mim em algum grupo,
# porque o seu mapa não dizia onde elas caem. Ajuste à vontade.

[Configurações rápidas] @ preferences-desktop
# A tela de hoje, sem mudança de conteúdo.
Configurações rápidas = kcm_landingpage

[Básico] @ preferences-system
Bluetooth = kcm_bluetooth
Discos e câmeras @ drive-harddisk
    Ações para dispositivos = kcm_solid_actions @ preferences-desktop-peripherals
    Montagem automática = kcm_device_automounter @ drive-removable-media
# extra: não existe KCM de armazenamento no Plasma; este é o "Locations"
# (pastas de Desktop, Documentos, Downloads). O resto de disco é automontagem,
# acima. O ícone do plugin é o do Dolphin (system-file-manager), que aqui
# confundiria com as abas do Dolphin; pasta diz o que a tela faz.
Armazenamento = kcm_desktoppaths @ folder
Wi-Fi e internet @ network-workgroup
    Wi-Fi e rede = kcm_networkmanagement
    Proxy = kcm_proxy
    # O plugin anuncia preferences-system-network-connection, que não existe em
    # tema nenhum da máquina (sairia um quadrado vazio).
    Preferências de conexão = kcm_netpref @ network-connect
    # extra: telas de rede móvel/celular, sem uso num desktop. Candidatas a sair.
    # Os símbolos `-symbolic` saíram: são traço fino, e no chip de 16 px somem.
    Wi-Fi móvel = kcm_mobile_wifi @ network-wireless
    Rede cabeada móvel = kcm_mobile_wired @ network-wired
    Rede celular = kcm_cellular_network @ smartphone
    Ponto de acesso = kcm_mobile_hotspot @ network-wireless-hotspot
Região e idioma = kcm_regionandlang
Data e hora = kcm_clock
Gerenciamento de energia @ preferences-system-power-management
    Perfis de energia = kcm_powerdevilprofilesconfig
    # extra: o mesmo assunto para celular. Bateria porque os dois chips ficavam
    # com o mesmo desenho do plugin.
    Energia móvel = kcm_mobile_power @ battery
Usuários = kcm_users
Aplicativo padrão @ preferences-desktop-default-applications
    Aplicativos padrão = kcm_componentchooser
    # extra: associações de arquivo são a mesma decisão ("o que abre o quê").
    Associações de arquivos = kcm_filetypes

[Avançado] @ configure
Notificações = kcm_notifications
Gerenciamento de janelas @ preferences-system-windows
    Comportamento de janelas = kcm_kwinoptions
    # Regras são uma lista de exceções; o plugin repetia o ícone das ações.
    Regras de janelas = kcm_kwinrules @ view-list-details
    Alternador de tarefas = kcm_kwintabbox
    Cantos de tela = kcm_kwinscreenedges
    Áreas de trabalho virtuais = kcm_kwin_virtualdesktops
    Efeitos do desktop = kcm_kwin_effects
    # extra
    Scripts do KWin = kcm_kwin_scripts @ utilities-terminal
    # extra: X11 é o servidor gráfico antigo; o X azul do Breeze não existe no
    # tema novo, então um monitor diz "camada de exibição" sem sair do estilo.
    Suporte a apps X11 = kcm_kwinxwayland @ video-display
Comportamento geral = kcm_workspace
Arquivos recentes = kcm_recentFiles @ document-open-recent
Sessão = kcm_smserver
Ciclo dia e noite @ weather-clear-night
    # Os dois KCMs apareciam com ícones emprestados do plugin (lighttable,
    # redshift); a aba dá o símbolo da noite e o chip da luz noturna usa o do
    # brilho, para os dois não ficarem idênticos.
    Ciclo dia e noite = kcm_nighttime @ weather-clear-night
    # extra: mesma função de cor por horário, em outro KCM.
    Luz noturna = kcm_nightlight @ brightness-high

[Entrada e saída] @ preferences-desktop-peripherals
Mouse e touchpad @ input-mouse
    Mouse = kcm_mouse
    Touchpad = kcm_touchpad
Teclado @ input-keyboard
    Teclado = kcm_keyboard
    # extra
    Teclado virtual = kcm_virtualkeyboard
    # extra: atalhos são operados pelo teclado.
    Atalhos = kcm_keys
Som @ audio-volume-high
    Som = kcm_pulseaudio
    # extra
    Sons do sistema = kcm_soundtheme @ audio-speakers
# extra: grupo inteiro sem lugar no seu mapa; são dispositivos de entrada.
Outros dispositivos @ preferences-desktop-peripherals
    Mesa digitalizadora = kcm_tablet
    Controle de jogos = kcm_gamecontroller
    Tela sensível ao toque = kcm_touchscreen
    Gestos de toque = kcm_kwintouchscreen

[Tela] @ preferences-desktop-display
Tela e monitor = kcm_kscreen
Papel de parede = kcm_wallpaper
Cores e temas @ preferences-desktop-theme
    Tema global = kcm_lookandfeel
    Cores = kcm_colors
    Estilo do Plasma = kcm_desktoptheme
    Estilo de aplicativos = kcm_style
    Decoração de janelas = kcm_kwindecoration
    Ícones = kcm_icons
    Cursores = kcm_cursortheme
    Tela de abertura = kcm_splashscreen
    # extra: logo do sistema é outra coisa que "tela de abertura" do Plasma.
    Abertura do sistema = kcm_plymouth @ computer
Texto e fonte @ preferences-desktop-font
    Fontes = kcm_fonts
    # extra
    Gerenciador de fontes = kcm_fontinst
Animação = kcm_animations
Acessibilidade = kcm_access
Bloqueio de tela = kcm_screenlocker @ system-lock-screen

[Outros] @ applications-other
Conta online = kcm_kaccounts
Feedback do usuário = kcm_feedback
Verificação ortográfica = kcm_spellchecking
Carteira KDE = kcm_kwallet5
Iniciar automaticamente = kcm_autostart
Pesquisa @ edit-find
    Busca de arquivos = kcm_baloofile
    Busca do Plasma = kcm_plasmasearch
    # extra
    Palavras-chave da web = kcm_webshortcuts
Atividades = kcm_activities
# extra: configurações de app e de serviço, sem lugar no seu mapa.
Aplicativos e sistema @ applications-system
    Dolphin (geral) = kcm_dolphingeneral @ system-file-manager
    Dolphin (modos de exibição) = kcm_dolphinviewmodes @ view-list-details
    Serviços em segundo plano = kcm_kded
    # O plugin anuncia o ícone de idioma; a tela é o renderizador gráfico do
    # Qt Quick (RHI).
    Renderizador do Plasma = kcm_qtquicksettings @ applications-graphics
