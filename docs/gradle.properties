# Project-wide Gradle settings for the Linux desktop app.
# The indexer is single-threaded on purpose; a big heap here would only hide
# memory leaks until the app is installed on a smaller machine.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
org.gradle.caching=true
org.gradle.parallel=true
kotlin.incremental=true
